<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bundle Test</title>
</head>
<body>
  <div id="root"></div>
  <script src="dist/bundle.js"></script>
  <script>
    // Check if React loaded
    if (window.React && window.ReactDOM) {
      console.log('✅ React loaded:', React.version);
    } else {
      console.error('❌ React not loaded');
    }
    // Check if framer-motion loaded
    if (window.Motion) {
      console.log('✅ Framer Motion loaded');
    } else {
      console.error('❌ Framer Motion not loaded');
    }
  </script>
</body>
</html>
