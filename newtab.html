<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnimeTab</title>
  <link rel="preload" href="dist/fonts/quicksand-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="dist/fonts/noto-serif-jp-700.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    html {
      background: #0a0a0f;
      color-scheme: dark; /* native <select> popups render dark instead of white */
    }
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0f;
      color: #f0f0f5;
      font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; }
    .loading-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a0f; display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.5s ease;
    }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(255,107,138,0.2);
      border-top: 3px solid #ff3d63;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen" class="loading-screen">
    <div class="spinner"></div>
  </div>
  <div id="root"></div>

  <script src="dist/bundle.js?v=1.5.0"></script>
</body>
</html>
