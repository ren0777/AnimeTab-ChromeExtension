<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnimeTab</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0a0a0f;
      color: #f0f0f5;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    #root { min-height: 100vh; padding-bottom: 160px; }
    .loading-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a0f; display: flex; align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.5s ease;
    }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(255,107,138,0.2);
      border-top: 3px solid #ff3d63;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen" class="loading-screen">
    <div class="spinner"></div>
  </div>
  <div id="root"></div>

  <!-- Merch & Monetization Section -->
  <div id="merch-section" style="position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: rgba(13, 15, 30, 0.95); backdrop-filter: blur(10px); border-top: 2px solid rgba(255, 107, 138, 0.3); padding: 12px 16px; max-height: 140px; overflow-y: auto;">
    <div style="max-width: 1200px; margin: 0 auto;">
      <div style="display: flex; gap: 12px; align-items: center; justify-content: space-between;">
        <div style="flex: 1; min-width: 0;">
          <div id="merch-card" style="display: flex; gap: 12px; align-items: center; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 107, 138, 0.2); border-radius: 12px; padding: 12px; cursor: pointer; transition: all 0.3s ease; hover: background rgba(255, 255, 255, 0.12);">
            <img id="merch-image" src="" alt="Merch" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: rgba(255, 255, 255, 0.05);">
            <div style="flex: 1; min-width: 0;">
              <div style="font-weight: 600; color: #ff6b8a; font-size: 14px;" id="merch-title"></div>
              <div style="font-size: 12px; color: rgba(255, 255, 255, 0.6); margin-top: 4px;" id="merch-price"></div>
              <div style="font-size: 11px; color: rgba(255, 255, 255, 0.4); margin-top: 4px;">🔗 Click to shop on Amazon</div>
            </div>
          </div>
        </div>
        <button id="merch-next" style="flex-shrink: 0; background: rgba(255, 107, 138, 0.2); border: 1px solid rgba(255, 107, 138, 0.4); color: #ff6b8a; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s ease;" title="Next product">→ Next</button>
      </div>
      <div style="font-size: 10px; color: rgba(255, 255, 255, 0.4); margin-top: 6px; text-align: center;">💡 Affiliate disclosure: We earn a small commission from Amazon purchases at no extra cost to you</div>
    </div>
  </div>



  <!-- Google AdSense (Optional - for future monetization) -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_ADSENSE_ID" crossorigin="anonymous"></script> -->

  <script src="dist/bundle.js?v=1.1.2"></script>
</body>
</html>
